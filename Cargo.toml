[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.1"
edition = "2024"
rust-version = "1.95"
license = "LGPL-3.0-or-later"

[workspace.dependencies]
thiserror = "2"
cc = "1"
tracing = "0.1"
getfem-geom = { path = "crates/getfem-geom" }
getfem-fem = { path = "crates/getfem-fem" }
getfem-gwfl = { path = "crates/getfem-gwfl" }
getfem-linalg = { path = "crates/getfem-linalg" }
getfem-model = { path = "crates/getfem-model" }
getfem-mumps = { path = "crates/getfem-mumps" }
getfem-arpack = { path = "crates/getfem-arpack" }
getfem-io = { path = "crates/getfem-io" }
getfem-xsmm = { path = "crates/getfem-xsmm" }
getfem-mpi = { path = "crates/getfem-mpi" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.test]
opt-level = 2

[profile.bench]
debug = "line-tables-only"
