[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "getfem-rs"
description = "GetFEM-rs from Python, close to GetFEM's Python interface"
requires-python = ">=3.12"
license = "LGPL-3.0-or-later"
dynamic = ["version"]
dependencies = ["numpy"]

[tool.maturin]
module-name = "getfem_rs"
